[project]
name = "warehouse-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "suhas", email = "geekystark" }
]
requires-python = ">=3.15"
dependencies = [
    "anthropic>=2.7.0",
    "fastapi>=0.162.2",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
warehouse-copilot = "warehouse_copilot:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
